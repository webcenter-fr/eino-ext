server: kubernetes
transport: http
addr: ":8080"
opsAddr: ":9090"
log:
  level: info
  format: text
kubernetes:
  clusters:
    local:
      kubeconfigFile: cmd/mcp-server/testdata/kubeconfig
      context: local
      disallowedNamespaces: [kube-system, kube-public, kube-node-lease]
      defaultTimeout: 30s
