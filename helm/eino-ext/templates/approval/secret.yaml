{{- if .Values.approval.enabled }}
{{- $fullname := include "eino-ext.fullname" . }}
{{- if not .Values.approval.receipt.existingSecret }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace (printf "%s-receipt" $fullname) }}
{{- $value := randAlphaNum 48 }}
{{- if and $secret (index $secret.data .Values.approval.receipt.secretKey) }}
{{- $value = index $secret.data .Values.approval.receipt.secretKey | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-receipt" $fullname }}
  labels:
    {{- include "eino-ext.labels" . | nindent 4 }}
    app.kubernetes.io/component: approval
type: Opaque
data:
  {{ .Values.approval.receipt.secretKey }}: {{ $value | b64enc | quote }}
---
{{- end }}
{{- if and .Values.approval.oidc.enabled (not .Values.approval.oidc.existingSecret) }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace (printf "%s-approval-oidc" $fullname) }}
{{- $value := .Values.approval.oidc.clientSecret }}
{{- if not $value }}
{{- $value = randAlphaNum 32 }}
{{- end }}
{{- if and $secret (index $secret.data .Values.approval.oidc.clientSecretKey) }}
{{- $value = index $secret.data .Values.approval.oidc.clientSecretKey | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-approval-oidc" $fullname }}
  labels:
    {{- include "eino-ext.labels" . | nindent 4 }}
    app.kubernetes.io/component: approval
type: Opaque
data:
  {{ .Values.approval.oidc.clientSecretKey }}: {{ $value | b64enc | quote }}
---
{{- end }}
{{- if and (eq .Values.approval.store.type "postgresql") (not .Values.approval.store.postgresql.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-approval-postgresql" $fullname }}
  labels:
    {{- include "eino-ext.labels" . | nindent 4 }}
    app.kubernetes.io/component: approval
type: Opaque
data:
  {{ .Values.approval.store.postgresql.dsnSecretKey }}: {{ .Values.approval.store.postgresql.dsn | b64enc | quote }}
{{- end }}
{{- end }}
