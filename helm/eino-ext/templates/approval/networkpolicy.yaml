{{- if and .Values.approval.enabled .Values.approval.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "eino-ext.fullname" . }}-approval
  labels:
    {{- include "eino-ext.labels" . | nindent 4 }}
    app.kubernetes.io/component: approval
spec:
  podSelector:
    matchLabels:
      {{- include "eino-ext.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: approval
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
{{- end }}
