{{- if and .Values.approval.enabled .Values.approval.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "eino-ext.fullname" . }}-approval
  labels:
    {{- include "eino-ext.labels" . | nindent 4 }}
    app.kubernetes.io/component: approval
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "eino-ext.fullname" . }}-approval
  minReplicas: {{ .Values.approval.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.approval.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.approval.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
