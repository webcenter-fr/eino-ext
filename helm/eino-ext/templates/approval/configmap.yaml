{{- if .Values.approval.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "eino-ext.fullname" . }}-approval
  labels:
    {{- include "eino-ext.labels" . | nindent 4 }}
    app.kubernetes.io/component: approval
data:
  config.yaml: |
{{ include "eino-ext.approvalConfig" . | indent 4 }}
  policy.json: |
{{ toJson .Values.approval.policy | indent 4 }}
{{- end }}
