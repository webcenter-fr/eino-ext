{{- if and .Values.approval.enabled .Values.approval.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eino-ext.serviceAccountName" (dict "root" . "component" "approval" "serviceAccount" .Values.approval.serviceAccount) }}
  labels:
    {{- include "eino-ext.labels" . | nindent 4 }}
  {{- with .Values.approval.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
