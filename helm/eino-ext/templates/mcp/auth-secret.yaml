{{- if and .Values.mcp.auth.enabled (not .Values.mcp.auth.existingSecret) }}
{{- $fullname := include "eino-ext.fullname" . }}
{{- $secret := lookup "v1" "Secret" .Release.Namespace (printf "%s-mcp-auth" $fullname) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-mcp-auth" $fullname }}
  labels:
    {{- include "eino-ext.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp-auth
type: Opaque
data:
{{- if .Values.mcp.auth.tokens }}
{{- range $token := .Values.mcp.auth.tokens }}
{{- $key := default (printf "%s-token" $token.name) $token.tokenKey }}
{{- $value := $token.token }}
{{- if not $value }}{{ $value = randAlphaNum 32 }}{{ end }}
{{- if and $secret (index $secret.data $key) }}{{ $value = index $secret.data $key | b64dec }}{{ end }}
  {{ $key }}: {{ $value | b64enc | quote }}
{{- end }}
{{- else }}
{{- $value := randAlphaNum 32 }}
{{- if and $secret (index $secret.data "admin-token") }}{{ $value = index $secret.data "admin-token" | b64dec }}{{ end }}
  admin-token: {{ $value | b64enc | quote }}
{{- end }}
{{- end }}
