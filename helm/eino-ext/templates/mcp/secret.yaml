{{- $root := . -}}
{{- $fullname := include "eino-ext.fullname" $root -}}
{{- $credentialLines := list -}}
{{- range $name, $cfg := $root.Values.mcpServers }}
{{- if $cfg.enabled }}
{{- $familySecret := include "eino-ext.familySecretName" (dict "root" $root "name" $name) }}
{{- $approvalToken := "" -}}
{{- if and $root.Values.mcp.approval.enabled (include "eino-ext.familyHasWriteTools" $name) -}}
{{- if $cfg.existingSecret -}}
{{- if not $cfg.approvalTokenHash -}}
{{- fail (printf "mcpServers.%s.existingSecret requires mcpServers.%s.approvalTokenHash" $name $name) -}}
{{- end -}}
{{- if not (regexMatch "^[0-9a-f]{64}$" $cfg.approvalTokenHash) -}}
{{- fail (printf "mcpServers.%s.approvalTokenHash must be a 64-character lowercase hex SHA-256" $name) -}}
{{- end -}}
{{- $credentialLines = append $credentialLines (printf "%s=sha256:%s@%s" $name $cfg.approvalTokenHash (include "eino-ext.familyInstances" (dict "name" $name "cfg" $cfg))) -}}
{{- else -}}
{{- $existing := lookup "v1" "Secret" $root.Release.Namespace $familySecret -}}
{{- $approvalToken = randAlphaNum 32 -}}
{{- if and $existing (index $existing.data "approval-token") -}}
{{- $approvalToken = index $existing.data "approval-token" | b64dec -}}
{{- end -}}
{{- $credentialLines = append $credentialLines (printf "%s=sha256:%s@%s" $name (sha256sum $approvalToken) (include "eino-ext.familyInstances" (dict "name" $name "cfg" $cfg))) -}}
{{- end -}}
{{- end -}}
{{- if not $cfg.existingSecret }}
{{- $hasData := false -}}
{{- if eq $name "kubernetes" -}}
{{- range $clusterName, $cluster := $cfg.clusters -}}{{- if not $cluster.inCluster -}}{{- $hasData = true -}}{{- end -}}{{- end -}}
{{- else -}}
{{- if $cfg.instances -}}{{- $hasData = true -}}{{- end -}}
{{- end -}}
{{- if $approvalToken -}}{{- $hasData = true -}}{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $familySecret }}
  labels:
    {{- include "eino-ext.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
type: Opaque
data:
{{- if not $hasData }} {}
{{- end }}
{{- if eq $name "kubernetes" }}
{{- range $clusterName, $cluster := $cfg.clusters }}
{{- if not $cluster.inCluster }}
  {{ default (printf "%s-kubeconfig" $clusterName) $cluster.kubeconfigSecretKey }}: {{ required (printf "mcpServers.kubernetes.clusters.%s.kubeconfig is required when existingSecret is empty" $clusterName) $cluster.kubeconfig | b64enc | quote }}
{{- end }}
{{- end }}
{{- else }}
{{- range $instanceName, $instance := $cfg.instances }}
  {{ default (printf "%s-token" $instanceName) $instance.tokenKey }}: {{ required (printf "mcpServers.%s.instances.%s.token is required when existingSecret is empty" $name $instanceName) $instance.token | b64enc | quote }}
{{- end }}
{{- end }}
{{- if $approvalToken }}
  approval-token: {{ $approvalToken | b64enc | quote }}
{{- end }}
---
{{- end }}
{{- end }}
{{- end }}
{{- if and $root.Values.approval.enabled (not $root.Values.approval.credentials.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-approval-credentials" $fullname }}
  labels:
    {{- include "eino-ext.labels" $root | nindent 4 }}
    app.kubernetes.io/component: approval
type: Opaque
data:
  {{ $root.Values.approval.credentials.secretKey }}: {{ join "\n" $credentialLines | b64enc | quote }}
{{- end }}
