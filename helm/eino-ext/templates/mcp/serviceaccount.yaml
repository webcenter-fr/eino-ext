{{- $root := . -}}
{{- range $name, $cfg := .Values.mcpServers }}
{{- if and $cfg.enabled $root.Values.mcp.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eino-ext.serviceAccountName" (dict "root" $root "component" $name "serviceAccount" $root.Values.mcp.serviceAccount) }}
  labels:
    {{- include "eino-ext.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  {{- with $root.Values.mcp.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- end }}
