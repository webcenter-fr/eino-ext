{{- $root := . -}}
{{- range $name, $cfg := .Values.mcpServers }}
{{- if and $cfg.enabled $root.Values.mcp.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "eino-ext.fullname" $root }}-{{ $name }}
  labels:
    {{- include "eino-ext.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  podSelector:
    matchLabels:
      {{- include "eino-ext.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    {{- with $root.Values.mcp.networkPolicy.mcpClientSelector }}
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
      ports:
        - port: 8080
          protocol: TCP
    {{- else }}
    - ports:
        - port: 8080
          protocol: TCP
    {{- end }}
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- if and $root.Values.mcp.approval.enabled (include "eino-ext.familyHasWriteTools" $name) }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "eino-ext.selectorLabels" $root | nindent 14 }}
              app.kubernetes.io/component: approval
      ports:
        - port: 8080
          protocol: TCP
    {{- end }}
    {{- with $root.Values.mcp.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
{{- end }}
{{- end }}
