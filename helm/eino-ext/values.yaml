## @section Global parameters
## @param global.imageRegistry Global image registry override
## @param global.imagePullSecrets Global image pull secrets
##
global:
  imageRegistry: ""
  imagePullSecrets: []

## @section Approval service parameters
## @param approval.enabled Deploy the standalone approval service
## @param approval.image.registry Approval image registry
## @param approval.image.repository Approval image repository
## @param approval.image.tag Approval image tag (defaults to Chart.AppVersion)
## @param approval.image.pullPolicy Approval image pull policy
## @param approval.replicaCount Approval replica count
## @param approval.baseURL Public approval base URL (defaults to the ingress host)
## @param approval.store.type Store backend: memory, file, redis, postgresql or opensearch
## @param approval.store.path File store directory
## @param approval.store.redis.addr Redis address
## @param approval.store.postgresql.dsn PostgreSQL DSN (stored in a Secret)
## @param approval.store.postgresql.existingSecret Existing Secret containing the PostgreSQL DSN
## @param approval.store.postgresql.dsnSecretKey Key in the PostgreSQL DSN Secret
## @param approval.store.opensearch.url OpenSearch URL
## @param approval.persistence.enabled Enable the file-store PVC
## @param approval.persistence.size PVC size
## @param approval.persistence.storageClass PVC storage class
## @param approval.persistence.accessMode PVC access mode
## @param approval.receipt.algorithm Receipt algorithm: HS256, RS256 or EdDSA
## @param approval.receipt.existingSecret Existing Secret containing the receipt secret
## @param approval.receipt.secretKey Key in the receipt Secret
## @param approval.oidc.enabled Enable OIDC browser login
## @param approval.oidc.issuer OIDC issuer URL
## @param approval.oidc.clientID OIDC client ID
## @param approval.oidc.clientSecret OIDC client secret (stored in a Secret)
## @param approval.oidc.existingSecret Existing Secret containing the OIDC client secret
## @param approval.oidc.clientSecretKey Key in the OIDC client secret Secret
## @param approval.oidc.redirectURL OIDC redirect URL
## @param approval.credentials.existingSecret Existing Secret containing the server credential file
## @param approval.credentials.secretKey Key in the server credential Secret
## @param approval.policy.rules Approver policy rules
## @param approval.ingress.enabled Enable the approval Ingress
## @param approval.ingress.className Ingress class name
## @param approval.ingress.host Ingress host
## @param approval.ingress.tls.enabled Enable Ingress TLS
## @param approval.ingress.tls.secretName Ingress TLS secret name
## @param approval.ingress.annotations Ingress annotations
## @param approval.resources Approval resource requests and limits
## @param approval.podDisruptionBudget.enabled Enable the approval PDB
## @param approval.podDisruptionBudget.minAvailable PDB minAvailable
## @param approval.autoscaling.enabled Enable the approval HPA (requires a shared store)
## @param approval.autoscaling.minReplicas HPA minimum replicas
## @param approval.autoscaling.maxReplicas HPA maximum replicas
## @param approval.autoscaling.targetCPUUtilizationPercentage HPA CPU target
## @param approval.networkPolicy.enabled Enable the approval NetworkPolicy
## @param approval.serviceAccount.create Create the approval ServiceAccount
## @param approval.serviceAccount.name Approval ServiceAccount name override
## @param approval.serviceAccount.annotations Approval ServiceAccount annotations
## @param approval.podAnnotations Approval pod annotations
## @param approval.nodeSelector Approval node selector
## @param approval.tolerations Approval tolerations
## @param approval.affinity Approval affinity
## @param approval.securityContext Approval container security context
## @param approval.podSecurityContext Approval pod security context
##
approval:
  enabled: true
  image:
    registry: ghcr.io
    repository: webcenter-fr/eino-ext/approval
    tag: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  baseURL: ""
  store:
    type: file
    path: /data
    redis:
      addr: ""
    postgresql:
      dsn: ""
      existingSecret: ""
      dsnSecretKey: postgres-dsn
    opensearch:
      url: ""
  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
  receipt:
    algorithm: HS256
    existingSecret: ""
    secretKey: receipt-secret
  oidc:
    enabled: false
    issuer: ""
    clientID: ""
    clientSecret: ""
    existingSecret: ""
    clientSecretKey: oidc-client-secret
    redirectURL: ""
  credentials:
    existingSecret: ""
    secretKey: credentials
  policy:
    rules: []
  ingress:
    enabled: false
    className: ""
    host: ""
    tls:
      enabled: false
      secretName: ""
    annotations: {}
  resources: {}
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
  networkPolicy:
    enabled: false
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext: {}
  podSecurityContext: {}

## @section MCP server parameters
## @param mcp.image.registry MCP image registry
## @param mcp.image.repository MCP image repository
## @param mcp.image.tag MCP image tag (defaults to Chart.AppVersion)
## @param mcp.image.pullPolicy MCP image pull policy
## @param mcp.auth.enabled Enable bearer-token authentication
## @param mcp.auth.existingSecret Existing Secret containing the auth token files
## @param mcp.auth.tokens Static auth tokens
## @param mcp.auth.requiredScopes Required token scopes
## @param mcp.authorization.enabled Enable RBAC
## @param mcp.authorization.rules[].groups Groups allowed by the rule
## @param mcp.authorization.rules[].operations Operations allowed by the rule
## @param mcp.approval.enabled Enable out-of-band approval for write tools
## @param mcp.networkPolicy.enabled Enable the MCP NetworkPolicy
## @param mcp.networkPolicy.mcpClientSelector Ingress client selector
## @param mcp.networkPolicy.extraEgress Extra egress rules
## @param mcp.serviceAccount.create Create one ServiceAccount per family
## @param mcp.serviceAccount.name ServiceAccount name override
## @param mcp.serviceAccount.annotations ServiceAccount annotations
## @param mcp.podAnnotations MCP pod annotations
## @param mcp.nodeSelector MCP node selector
## @param mcp.tolerations MCP tolerations
## @param mcp.affinity MCP affinity
## @param mcp.resources MCP resource requests and limits
## @param mcp.securityContext MCP container security context
## @param mcp.podSecurityContext MCP pod security context
##
mcp:
  image:
    registry: ghcr.io
    repository: webcenter-fr/eino-ext/mcp
    tag: ""
    pullPolicy: IfNotPresent
  auth:
    enabled: true
    existingSecret: ""
    tokens: []
    requiredScopes: []
  authorization:
    enabled: true
    rules:
      - groups: []
        operations: [read]
  approval:
    enabled: true
  networkPolicy:
    enabled: false
    mcpClientSelector: {}
    extraEgress: []
  serviceAccount:
    create: true
    name: ""
    annotations: {}
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources: {}
  securityContext: {}
  podSecurityContext: {}

## @section MCP families
## @param mcpServers.kubernetes.enabled Enable the Kubernetes MCP server
## @param mcpServers.kubernetes.rbac.create Create the Kubernetes RBAC
## @param mcpServers.kubernetes.rbac.scope RBAC scope: cluster or namespace
## @param mcpServers.kubernetes.rbac.namespaces Namespaces for namespace-scoped RBAC
## @param mcpServers.kubernetes.rbac.allowWrite DANGEROUS: allow resource create/patch/delete/apply
## @param mcpServers.kubernetes.rbac.allowExec DANGEROUS: allow pods/exec (arbitrary command execution)
## @param mcpServers.kubernetes.clusters.in-cluster.inCluster Use the in-cluster service account
## @param mcpServers.kubernetes.clusters.in-cluster.disallowedNamespaces Namespaces the tools refuse to touch
## @param mcpServers.kubernetes.clusters.in-cluster.defaultTimeout Default operation timeout
## @param mcpServers.kubernetes.existingSecret Existing Secret containing the cluster kubeconfigs
## @param mcpServers.kubernetes.approvalTokenHash Approval token hash when existingSecret is used
## @param mcpServers.kubernetes.replicaCount Kubernetes MCP replica count
## @param mcpServers.kubernetes.service.type Kubernetes MCP Service type
## @param mcpServers.kubernetes.service.port Kubernetes MCP Service port
## @param mcpServers.kubernetes.ingress.enabled Enable the Kubernetes MCP Ingress
## @param mcpServers.kubernetes.ingress.className Ingress class name
## @param mcpServers.kubernetes.ingress.host Ingress host
## @param mcpServers.kubernetes.ingress.tls.enabled Enable Ingress TLS
## @param mcpServers.kubernetes.ingress.tls.secretName Ingress TLS secret name
## @param mcpServers.kubernetes.ingress.annotations Ingress annotations
## @param mcpServers.kubernetes.podDisruptionBudget.enabled Enable the Kubernetes MCP PDB
## @param mcpServers.kubernetes.podDisruptionBudget.minAvailable PDB minAvailable
## @param mcpServers.kubernetes.autoscaling.enabled Enable the Kubernetes MCP HPA
## @param mcpServers.kubernetes.autoscaling.minReplicas HPA minimum replicas
## @param mcpServers.kubernetes.autoscaling.maxReplicas HPA maximum replicas
## @param mcpServers.kubernetes.autoscaling.targetCPUUtilizationPercentage HPA CPU target
## @param mcpServers.kubernetes.resources Kubernetes MCP resource requests and limits
## @param mcpServers.kubernetes.podAnnotations Kubernetes MCP pod annotations
## @param mcpServers.kubernetes.nodeSelector Kubernetes MCP node selector
## @param mcpServers.kubernetes.tolerations Kubernetes MCP tolerations
## @param mcpServers.kubernetes.affinity Kubernetes MCP affinity
## @param mcpServers.argocd.enabled Enable the ArgoCD MCP server
## @param mcpServers.argocd.instances ArgoCD instances
## @param mcpServers.argocd.existingSecret Existing Secret containing the ArgoCD tokens
## @param mcpServers.argocd.approvalTokenHash Approval token hash when existingSecret is used
## @param mcpServers.argocd.replicaCount ArgoCD MCP replica count
## @param mcpServers.argocd.service.type ArgoCD MCP Service type
## @param mcpServers.argocd.service.port ArgoCD MCP Service port
## @param mcpServers.argocd.ingress.enabled Enable the ArgoCD MCP Ingress
## @param mcpServers.argocd.ingress.className Ingress class name
## @param mcpServers.argocd.ingress.host Ingress host
## @param mcpServers.argocd.ingress.tls.enabled Enable Ingress TLS
## @param mcpServers.argocd.ingress.tls.secretName Ingress TLS secret name
## @param mcpServers.argocd.ingress.annotations Ingress annotations
## @param mcpServers.argocd.podDisruptionBudget.enabled Enable the ArgoCD MCP PDB
## @param mcpServers.argocd.podDisruptionBudget.minAvailable PDB minAvailable
## @param mcpServers.argocd.autoscaling.enabled Enable the ArgoCD MCP HPA
## @param mcpServers.argocd.autoscaling.minReplicas HPA minimum replicas
## @param mcpServers.argocd.autoscaling.maxReplicas HPA maximum replicas
## @param mcpServers.argocd.autoscaling.targetCPUUtilizationPercentage HPA CPU target
## @param mcpServers.argocd.resources ArgoCD MCP resource requests and limits
## @param mcpServers.argocd.podAnnotations ArgoCD MCP pod annotations
## @param mcpServers.argocd.nodeSelector ArgoCD MCP node selector
## @param mcpServers.argocd.tolerations ArgoCD MCP tolerations
## @param mcpServers.argocd.affinity ArgoCD MCP affinity
## @param mcpServers.prometheus.enabled Enable the Prometheus MCP server
## @param mcpServers.prometheus.instances Prometheus instances
## @param mcpServers.prometheus.existingSecret Existing Secret containing the Prometheus tokens
## @param mcpServers.prometheus.approvalTokenHash Approval token hash when existingSecret is used
## @param mcpServers.prometheus.replicaCount Prometheus MCP replica count
## @param mcpServers.prometheus.service.type Prometheus MCP Service type
## @param mcpServers.prometheus.service.port Prometheus MCP Service port
## @param mcpServers.prometheus.ingress.enabled Enable the Prometheus MCP Ingress
## @param mcpServers.prometheus.ingress.className Ingress class name
## @param mcpServers.prometheus.ingress.host Ingress host
## @param mcpServers.prometheus.ingress.tls.enabled Enable Ingress TLS
## @param mcpServers.prometheus.ingress.tls.secretName Ingress TLS secret name
## @param mcpServers.prometheus.ingress.annotations Ingress annotations
## @param mcpServers.prometheus.podDisruptionBudget.enabled Enable the Prometheus MCP PDB
## @param mcpServers.prometheus.podDisruptionBudget.minAvailable PDB minAvailable
## @param mcpServers.prometheus.autoscaling.enabled Enable the Prometheus MCP HPA
## @param mcpServers.prometheus.autoscaling.minReplicas HPA minimum replicas
## @param mcpServers.prometheus.autoscaling.maxReplicas HPA maximum replicas
## @param mcpServers.prometheus.autoscaling.targetCPUUtilizationPercentage HPA CPU target
## @param mcpServers.prometheus.resources Prometheus MCP resource requests and limits
## @param mcpServers.prometheus.podAnnotations Prometheus MCP pod annotations
## @param mcpServers.prometheus.nodeSelector Prometheus MCP node selector
## @param mcpServers.prometheus.tolerations Prometheus MCP tolerations
## @param mcpServers.prometheus.affinity Prometheus MCP affinity
## @param mcpServers.grafana.enabled Enable the Grafana MCP server
## @param mcpServers.grafana.instances Grafana instances
## @param mcpServers.grafana.existingSecret Existing Secret containing the Grafana tokens
## @param mcpServers.grafana.approvalTokenHash Approval token hash when existingSecret is used
## @param mcpServers.grafana.replicaCount Grafana MCP replica count
## @param mcpServers.grafana.service.type Grafana MCP Service type
## @param mcpServers.grafana.service.port Grafana MCP Service port
## @param mcpServers.grafana.ingress.enabled Enable the Grafana MCP Ingress
## @param mcpServers.grafana.ingress.className Ingress class name
## @param mcpServers.grafana.ingress.host Ingress host
## @param mcpServers.grafana.ingress.tls.enabled Enable Ingress TLS
## @param mcpServers.grafana.ingress.tls.secretName Ingress TLS secret name
## @param mcpServers.grafana.ingress.annotations Ingress annotations
## @param mcpServers.grafana.podDisruptionBudget.enabled Enable the Grafana MCP PDB
## @param mcpServers.grafana.podDisruptionBudget.minAvailable PDB minAvailable
## @param mcpServers.grafana.autoscaling.enabled Enable the Grafana MCP HPA
## @param mcpServers.grafana.autoscaling.minReplicas HPA minimum replicas
## @param mcpServers.grafana.autoscaling.maxReplicas HPA maximum replicas
## @param mcpServers.grafana.autoscaling.targetCPUUtilizationPercentage HPA CPU target
## @param mcpServers.grafana.resources Grafana MCP resource requests and limits
## @param mcpServers.grafana.podAnnotations Grafana MCP pod annotations
## @param mcpServers.grafana.nodeSelector Grafana MCP node selector
## @param mcpServers.grafana.tolerations Grafana MCP tolerations
## @param mcpServers.grafana.affinity Grafana MCP affinity
##
mcpServers:
  kubernetes:
    enabled: true
    rbac:
      create: true
      scope: cluster
      namespaces: []
      allowWrite: false
      allowExec: false
    clusters:
      in-cluster:
        inCluster: true
        disallowedNamespaces: [kube-system, kube-public, kube-node-lease]
        defaultTimeout: 30s
    existingSecret: ""
    approvalTokenHash: ""
    replicaCount: 1
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
      className: ""
      host: ""
      tls:
        enabled: false
        secretName: ""
      annotations: {}
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
    resources: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  argocd:
    enabled: false
    instances: {}
    existingSecret: ""
    approvalTokenHash: ""
    replicaCount: 1
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
      className: ""
      host: ""
      tls:
        enabled: false
        secretName: ""
      annotations: {}
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
    resources: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  prometheus:
    enabled: false
    instances: {}
    existingSecret: ""
    approvalTokenHash: ""
    replicaCount: 1
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
      className: ""
      host: ""
      tls:
        enabled: false
        secretName: ""
      annotations: {}
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
    resources: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  grafana:
    enabled: false
    instances: {}
    existingSecret: ""
    approvalTokenHash: ""
    replicaCount: 1
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
      className: ""
      host: ""
      tls:
        enabled: false
        secretName: ""
      annotations: {}
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    autoscaling:
      enabled: false
      minReplicas: 1
      maxReplicas: 3
      targetCPUUtilizationPercentage: 80
    resources: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
