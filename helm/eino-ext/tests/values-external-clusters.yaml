mcpServers:
  kubernetes:
    clusters:
      in-cluster:
        inCluster: true
      prod:
        kubeconfig: |
          apiVersion: v1
          kind: Config
          clusters:
            - cluster:
                server: https://prod.example.com:6443
              name: prod
          contexts:
            - context:
                cluster: prod
                user: prod
              name: prod
          current-context: prod
          users:
            - name: prod
              user:
                token: dummy
        context: prod
        disallowedNamespaces: [kube-system]
        defaultTimeout: 45s
