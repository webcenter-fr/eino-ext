approval:
  replicaCount: 2
  store:
    type: redis
    redis:
      addr: redis:6379
  oidc:
    enabled: true
    issuer: https://idp.example.com
    clientID: approval
    clientSecret: oidc-secret
    redirectURL: https://approve.example.com/auth/callback
  ingress:
    enabled: true
    className: nginx
    host: approve.example.com
    tls:
      enabled: true
      secretName: approval-tls
  podDisruptionBudget:
    enabled: true
  autoscaling:
    enabled: true
  networkPolicy:
    enabled: true
mcp:
  auth:
    tokens:
      - name: alice
        user: alice
        groups: [devs]
        scopes: [mcp]
        token: alice-token
  authorization:
    rules:
      - users: [alice]
        operations: [read, write]
  networkPolicy:
    enabled: true
    mcpClientSelector:
      app: mcp-client
    extraEgress:
      - to:
          - namespaceSelector: {}
        ports:
          - port: 443
            protocol: TCP
mcpServers:
  kubernetes:
    rbac:
      allowWrite: true
      allowExec: true
    clusters:
      in-cluster:
        inCluster: true
      prod:
        kubeconfig: |
          apiVersion: v1
          kind: Config
          clusters: []
          contexts: []
          users: []
        context: prod
  argocd:
    enabled: true
    instances:
      prod:
        url: https://argocd.example.com
        token: argocd-token
  prometheus:
    enabled: true
    instances:
      prod:
        url: https://prometheus.example.com
        token: prometheus-token
  grafana:
    enabled: true
    instances:
      prod:
        url: https://grafana.example.com
        token: grafana-token
